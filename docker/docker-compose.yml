services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ecommerce-app
    environment:
      - MONGO_URI=mongodb://mongo:27017/shop
      - PORT=3000
    depends_on: [mongo]
    networks: [shopnet]
  mongo:
    image: mongo:7
    container_name: mongo
    volumes: [mongo-data:/data/db]
    networks: [shopnet]
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    networks: [shopnet]
volumes:
  mongo-data:
networks:
  shopnet:
