imageTag: "8.13.4"

daemonset:
  extraEnvs: []

  secretMounts: []

  filebeatConfig:
    filebeat.yml: |
      filebeat.inputs:
        - type: container
          paths:
            - /var/log/containers/*.log

          processors:
            - add_kubernetes_metadata:
                host: ${NODE_NAME}
                matchers:
                  - logs_path:
                      logs_path: "/var/log/containers/"

      output.elasticsearch:
        hosts:
          - "http://172.31.9.173:9200"

      setup.ilm.enabled: false
      setup.template.enabled: true

      logging.level: info

  securityContext:
    runAsUser: 0
    privileged: true
