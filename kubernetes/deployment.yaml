apiVersion: apps/v1
kind: Deployment
metadata: { name: ecommerce, namespace: ecommerce }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: ecommerce }
  template:
    metadata: { labels: { app: ecommerce } }
    spec:
      containers:
        - name: app
          image: mahendra46/ecommerce:v1
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: ecommerce-config }
            - secretRef: { name: ecommerce-secret }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
