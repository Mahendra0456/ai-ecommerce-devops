apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ecommerce, namespace: ecommerce }
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: ecommerce, port: { number: 80 } }
